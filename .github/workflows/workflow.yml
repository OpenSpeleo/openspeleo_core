name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  linter:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - uses: j178/prek-action@v2
        with:
          install-only: true

      - run: |
          prek run \
            --show-diff-on-failure \
            --color always \
            --all-files

  test-rust:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: update
        run: |
          rustup update
          rustup component add clippy
          rustup install nightly

      - name: lint
        run: |
          cargo fmt -- --check
          cargo clippy -- -D warnings

      - name: test
        run: |
          cargo check
          cargo test --all

  test-python:
    if: github.ref_type != 'tag'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install the package and test dependencies
        run: |
          uv sync --all-extras --frozen

      - name: Run tests
        run: |
          uv run python --version
          uv run pytest

  trigger-release:
    name: Trigger release
    needs: [linter, test-rust, test-python]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch latest tags
        run: git fetch --tags --force

      - name: Dispatch release if commit is tagged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(git tag --points-at HEAD --list 'v*' | head -n 1)
          if [ -z "$TAG" ]; then
            echo "No v* tag on HEAD — skipping release"
            exit 0
          fi
          echo "Found tag $TAG — dispatching release workflow"
          gh workflow run release.yml --ref "$TAG"
